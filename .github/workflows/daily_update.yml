name: Aggiornamento Automatico Bollettino GU

on:
  schedule:
    # La Serie Generale viene pubblicata in serata: controlli alle 13, 20 e 21 italiane (ora legale)
    - cron: '0 11 * * 1-6'
    - cron: '0 18 * * 1-6'
    - cron: '0 19 * * 1-6'
  workflow_dispatch:
    inputs:
      gu_date:
        description: 'Data da rifare (AAAA-MM-GG). Vuoto = automatico'
        required: false
        default: ''

concurrency:
  group: bollettino-gu
  cancel-in-progress: false

jobs:
  update-bulletin:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Configurazione Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Installazione dipendenze
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install google-genai requests pypdf

      - name: Controlla che gli script siano completi
        run: |
          for f in generate.py tools/make_audio.py tools/build_audio.py; do
            python -m py_compile "$f" || { echo "❌ $f non è valido: ricaricalo per intero."; exit 1; }
            tail -3 "$f" | grep -q "main()" || { echo "❌ $f è incompleto: ricaricalo per intero."; exit 1; }
          done

      - name: Cache della voce Paola
        uses: actions/cache@v4
        with:
          path: ~/.cache/bollettino-gu-tts
          key: paola-tts-1.12.14

      - name: Analisi della Gazzetta
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GU_DATE: ${{ github.event.inputs.gu_date }}
        run: python generate.py

      - name: Lettura audio
        run: python tools/make_audio.py

      - name: Commit e push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ audio/
          if git diff --cached --quiet; then echo "Nessuna novità."; exit 0; fi
          git commit -m "Bollettino GU: aggiornamento $(TZ=Europe/Rome date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
